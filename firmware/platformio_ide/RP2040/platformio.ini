; SuperPad-V1 / Alpakka firmware — RP2040 (Raspberry Pi Pico)
; PlatformIO 工程配置。上游官方用 CMake + pico-sdk 构建，这里等价映射为 PlatformIO pico 框架。
; 参考：RelayNode-SW2MQTT 的 firmware/<platform>/<chip>/ 目录组织方式。

[platformio]
default_envs = alpakka_v0

; --- alpakka_v0: Raspberry Pi Pico 本体 ---
[env:alpakka_v0]
; 官方 platformio/raspberrypi 只支持 arduino framework，不提供原生 pico-sdk。
; 使用社区维护的 maxgerhardt fork 的 develop 分支，支持原生 pico-sdk（framework = picosdk，
; 与上游 CMake + pico-sdk 构建等价）。
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#develop
board = pico
framework = picosdk
monitor_speed = 115200
extra_scripts =
    pre:scripts/gen_version.py
    pre:scripts/build_tinyusb.py
build_flags =
    -DDEVICE_ALPAKKA_V0=1
    -DDEVICE_IS_ALPAKKA=1
    -DPIO_STDIO_UART=1
    -I src/headers
    -I src/pico_extras/hardware_rosc/include
    -I src/pico_extras/pico_sleep/include
    -Wno-error

; --- 备选目标（如需在 Pico 上验证其它固件目标，取消注释）---
; alpakka_v1 需要 Marmota 模块（Dongle 同硬件），普通 Pico 上不完整，默认不启用。
; [env:alpakka_v1]
; platform = https://github.com/maxgerhardt/platform-raspberrypi.git#develop
; board = pico
; framework = picosdk
; build_flags =
;     -DDEVICE_ALPAKKA_V1=1
;     -DDEVICE_IS_ALPAKKA=1
;     -DDEVICE_HAS_MARMOTA=1
;     -I src/headers

; --- 编译/烧录用法 ---
; pio run                      # 编译 alpakka_v0
; pio run -t upload            # 烧录（Pico 需进入 BOOTSEL）
; pio device monitor           # 串口日志（115200）
